services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpay-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpay-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Read by the browser, so it must be the host-visible API address.
      VITE_API_URL: http://localhost:3000
      # Needed for hot reload when files live on a Windows drive.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  redis:
    image: redis:8-alpine
    container_name: smartpay-redis
    restart: unless-stopped
    # Publish Redis to the host so the API can also be run outside Docker
    # (npm run start:dev) and still reach it on localhost:6379.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
